<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="t d">
  <title id="t">ClipForge</title>
  <desc id="d">ClipForge — turn long videos into viral shorts with AI</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07060d"/>
      <stop offset="1" stop-color="#0d0b1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.75" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="0.9" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="phone1"><rect x="0" y="0" width="150" height="266" rx="18"/></clipPath>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>
  <rect width="1280" height="480" fill="url(#grid)"/>
  <rect width="1280" height="480" fill="url(#glow1)"/>
  <rect width="1280" height="480" fill="url(#glow2)"/>

  <!-- Left: wordmark -->
  <g transform="translate(88 150)">
    <g transform="translate(0 6)">
      <rect width="64" height="64" rx="16" fill="url(#accent)"/>
      <path d="M22 18 L46 32 L22 46 Z" fill="#07060d"/>
      <path d="M40 44 l6 -10 l6 10 z" fill="url(#ember)"/>
    </g>
    <text x="84" y="56" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-2">Clip<tspan fill="url(#accent)">Forge</tspan></text>
    <text x="0" y="128" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#e4e4f0">Long videos in. Viral shorts out.</text>
    <text x="0" y="168" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="18" fill="#9b9bb4">AI moment detection · smart 9:16 reframing · animated captions · SEO packs</text>
    <g transform="translate(0 200)" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="14" font-weight="600">
      <rect width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="59" y="21" text-anchor="middle" fill="#c4b5fd">100% local</text>
      <rect x="130" width="132" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="196" y="21" text-anchor="middle" fill="#a5f3fc">GPU accelerated</text>
      <rect x="274" width="120" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="334" y="21" text-anchor="middle" fill="#fde68a">99 languages</text>
    </g>
  </g>

  <!-- Right: stacked 9:16 clip cards -->
  <g transform="translate(790 70)">
    <g transform="translate(0 50) rotate(-8 75 133)" opacity="0.55">
      <rect width="150" height="266" rx="18" fill="#1a1730" stroke="#ffffff" stroke-opacity="0.1"/>
    </g>
    <g transform="translate(280 40) rotate(7 75 133)" opacity="0.6">
      <rect width="150" height="266" rx="18" fill="#141a2e" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="20" y="200" width="110" height="10" rx="5" fill="#ffffff" fill-opacity="0.25"/>
    </g>
    <!-- hero card -->
    <g transform="translate(130 0)">
      <rect x="-6" y="-6" width="182" height="352" rx="28" fill="url(#accent)" opacity="0.5" filter="url(#soft)"/>
      <rect width="170" height="340" rx="24" fill="#120f22" stroke="url(#accent)" stroke-width="2"/>
      <!-- subject silhouette -->
      <circle cx="85" cy="128" r="34" fill="#2a2550"/>
      <path d="M30 250 q55 -80 110 0 v20 h-110z" fill="#2a2550"/>
      <!-- face tracking box -->
      <rect x="44" y="86" width="82" height="86" rx="8" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="10 6"/>
      <!-- hook title -->
      <rect x="18" y="24" width="134" height="30" rx="8" fill="#ffffff"/>
      <text x="85" y="45" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="14" font-weight="800" fill="#07060d">THIS CHANGED IT 🔥</text>
      <!-- captions -->
      <text x="85" y="290" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="22" fill="#ffffff" stroke="#000" stroke-width="1">NOBODY <tspan fill="#facc15">TALKS</tspan></text>
      <text x="85" y="316" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="22" fill="#ffffff" stroke="#000" stroke-width="1">ABOUT THIS</text>
      <!-- score ring -->
      <g transform="translate(150 70)">
        <circle r="24" fill="#07060d" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>
        <circle r="24" fill="none" stroke="url(#ember)" stroke-width="4" stroke-dasharray="142 151" transform="rotate(-90)" stroke-linecap="round"/>
        <text y="6" text-anchor="middle" font-family="'Segoe UI', Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff">94</text>
      </g>
    </g>
    <!-- hashtag chips -->
    <g font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" transform="translate(40 330)">
      <rect width="104" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.5"/>
      <text x="52" y="19" text-anchor="middle" fill="#ddd6fe">#viralshorts</text>
      <rect x="290" y="-10" width="96" height="28" rx="14" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="338" y="9" text-anchor="middle" fill="#cffafe">#podcast</text>
    </g>
  </g>
</svg>
